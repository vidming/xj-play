elf:stretch;display:flex;align-items:center;padding:0 17px;border-bottom:3px solid #3a7c4b;background:#fff;color:#3e7049}.tab-space{flex:1}.save{font-size:10px;display:flex;align-items:center;gap:7px;color:#879983;white-space:nowrap}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#26805a}.error{background:#fff4e6;color:#956326;padding:10px 18px;font-size:11px}.primary,.secondary{display:inline-flex;justify-content:center;align-items:center;padding:11px 17px;border-radius:3px;font-size:12px}.primary{background:var(--green);color:white;border:1px solid var(--green)}.secondary{border:1px solid #cfddcf;color:#5b805e;background:white}.modal{border:1px solid #d5dfd6;border-radius:7px;padding:28px;max-width:490px;width:calc(100% - 40px);color:#425747;box-shadow:0 24px 100px #182e3330}.modal::backdrop{background:#152e264d}.modal h2{font-size:19px;margin:0 0 14px}.modal p{font-size:12px;color:#7a8b7d}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}@media(max-width:640px){.titlebar{height:48px;padding:0 14px;gap:10px}.brand{font-size:13px}.logo{width:22px;height:24px;font-size:16px}.title{font-size:10px;text-align:right}.title span{display:none}.ribbon{height:36px;padding:0 9px;gap:4px}.ribbon button{padding:0 10px;font-size:11px}.ribbon-note{font-size:9px}.side{display:none}.toolbar{min-height:48px;padding:8px 13px;font-size:11px}.toolbar-icon{font-size:17px;margin-right:6px}.text-button{font-size:10px}.grid{min-width:0;--cols:26px 58px repeat(4,minmax(0,1fr)) 44px}.headers{height:24px;font-size:9px}.num{font-size:9px}.speaker{font-size:10px;padding:12px 7px}.content{padding:15px 12px;font-size:12px;line-height:1.95}.meta{font-size:9px;padding:4px}.title-row{min-height:74px}.title-row h1{font-size:21px;padding-left:12px}.intro-row .content{font-size:9px;padding:10px 12px}.formula{gap:10px;font-size:9px}.address{width:60px;font-size:10px}.divider .speaker,.divider .content{font-size:9px}.option{padding-left:9px;gap:8p <body>
<div id="app" class="app"><header class="titlebar"><div class="brand"><span class="logo">▤</span>资料归档</div><div class="title">第七位来电者 <span>/ 单文件试玩</span></div><button class="top-action" id="help">使用说明</button></header><nav class="ribbon"><button class="active">剧情记录</button><button id="note-tab">线索备忘</button><span class="ribbon-note">Excel 风格交互 · 无需安装</span></nav><div class="body"><aside class="side"><button class="back" id="restart-top">↻ 重新开始</button><div class="label">此工作簿</div><button class="story selected"><span class="story-icon">▤</span><span>第七位来电者<small>试玩样例</small></span><span class="arrow">›</span></button><div class="side-note"><span class="dot"></span><strong>游客 · 本机进度</strong><p>进度保存在当前浏览器。<br>发送此文件不包含你的个人数据。</p><button id="export">导出进度备份 ↗</button></div></aside><main class="workbook"><div class="toolbar"><div><span class="toolbar-icon">▤</span><strong>第七位来电者</strong><span class="muted"> / 交互样例</span></div><button class="text-button" id="restart">重新开始</button></div><div class="formula"><span class="address" id="address">B4</span><span class="fx">ƒx</span><span id="formula-text">点击继续阅读，在选项行作出选择</span></div><div id="error" class="error" hidden></div><div id="scroll" class="scroll" tabindex="0" aria-label="剧情记录，可滚动回看"><div class="grid"><div class="headers"><span>◢</span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span></div><div class="row title-row"><span class="num">1</span><span class="speaker">资料名称</span><h1 class="content">第七位来电者</h1><span class="meta">样例</span></div><div class="row intro-row"><span class="num">2</span><span class="speaker">说明</span><span class="content">短片段玩法验证 · 点击操作 · 无需键盘输入</span><span class="meta">只读</span></div><div class="row divider"><span class="num">3</span><span class="speaker">来源</span><span class="content">通话记录</span><span class="meta">状态</span></div><div id="rows"></div><div id="tail"></div></div></div><footer class="tabs"><span class="tab">剧情记录</span><span class="tab-space"></span><span class="save" id="save-state"><i class="dot"></i>已保存到本机</span></footer></main></div><dialog id="dialog" class="modal"><h2>重新开始这份记录？</h2><p>会覆盖当前浏览器里的试玩进度。本文件不会上传或读取你的个人信息。</p><div class="dialog-actions"><button class="secondary" id="cancel">保留进度</button><button class="primary" id="confirm">确认重新开始</button></div></dialog></div>
<script>
const story={start:'incoming_call',nodes:{incoming_call:{type:'choice',lines:[['旁白','电话响起，对方报出了现场尚未公开的一处细节。'],['来电者','“你们找错人了。”']],options:[['ask','追问身份','ask_identity'],['verify','要求说出另一处现场细节','verify_detail']]},ask_identity:{type:'scene',lines:[['你','“你是谁？”'],['来电者','“一个不想成为下一个的人。”']],next:'end'},verify_detail:{type:'scene',lines:[['你','“还有什么能证明你去过现场？”'],['来电者','他报出了另一项细节。你记下来，准备向现场人员核验。']],next:'end'},end:{type:'ending',lines:[['旁白','电话突然断了。']]}}};
const KEY='seventh-caller-single-file-v1';let save;let busy=false;const $=id=>document.getElementById(id);function fresh(){return{node:story.start,visits:[],done:false}}function validSave(x){if(!x||typeof x!=='object'||!story.nodes[x.node]||!Array.isArray(x.visits)||typeof x.done!=='boolean')return false;return x.visits.every(v=>{const n=v&&story.nodes[v.node];if(!n||!Number.isInteger(v.count)||v.count<0||v.count>n.lines.length)return false;return v.choice==null||(n.type==='choice'&&n.options.some(o=>o[0]===v.choice))})}function load(){try{const raw=localStorage.getItem(KEY);const x=raw?JSON.parse(raw):null;save=validSave(x)?x:fresh();if(raw&&!validSave(x)){$('error').hidden=false;$('error').textContent='检测到无效的旧进度，已为你重新开始。'}}catch{save=fresh();$('error').hidden=false;$('error').textContent='此浏览器不允许读取本机进度；仍可正常试玩，刷新后可能重置。'}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));$('save-state').innerHTML='<i class="dot"></i>已保存到本机'}catch{$('save-state').innerHTML='<i class="dot" style="background:#ba7332"></i>仅当前页面有效'}}function current(){return story.nodes[save.node]}function rows(){return save.visits.flatMap(v=>{const n=story.nodes[v.node];const lines=n.lines.slice(0,v.count).map((l,i)=>({kind:'line',speaker:l[0],text:l[1],id:v.id+'l'+i}));const opts=n.type==='choice'&&v.count===n.lines.length?n.options.map(o=>({kind:'option',speaker:'选择',text:o[1],id:v.id+o[0],choice:o[0],selected:v.choice===o[0],locked:!!v.choice})):[];return lines.concat(opts)})}function render(){const r=rows();$('rows').innerHTML=r.map((x,i)=>x.kind==='line'?'<div class="row narrative"><span class="num">'+(i+4)+'</span><span class="speaker">'+x.speaker+'</span><span class="content">'+x.text+'</span><span class="meta">已读</span></div>':'<div class="row choice '+(x.selected?'chosen ':'')+(x.locked&&!x.selected?'locked':'')+'"><span class="num">'+(i+4)+'</span><span class="speaker">选择</span><button class="content option" '+(x.locked?'disabled':'')+' data-choice="'+x.choice+'"><span>'+(x.selected?'✓':x.locked?'—':'↳')+'</span>'+x.text+'</button><span class="meta">'+(x.selected?'已选':x.locked?'未选':'待选择')+'</span></div>').join('');const n=current();const v=save.visits.at(-1);let tail='';if(save.done)tail='<div class="ending"><span class="check">✓</span><div><strong>本次记录结束</strong><p>教学片段已读完，正式首章将在后续补全。</p></div><button class="secondary" id="again">重新开始</button></div>';else if(n.type==='choice'&&v&&v.count===n.lines.length&&!v.choice)tail='<div class="hint">↑ 请选择一项，继续这段记录</div>';else tail='<div class="row action"><span class="num">'+(r.length+4)+'</span><span class="speaker">操作</span><div class="content"><button class="continue" id="continue">继续阅读 <span>→</span></button></div><span class="meta">点击</span></div>';$('tail').innerHTML=tail;$('address').textContent='B'+Math.max(4,r.length+3);$('formula-text').textContent=save.done?'样例已读完，可回看或重新开始':n.type==='choice'&&v&&v.count===n.lines.length&&!v.choice?'请在选项行作出选择':'点击继续阅读，在选项行作出选择';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));$('continue')?.addEventListener('click',advance);$('again')?.addEventListener('click',()=>openReset());}
function advance(){if(busy||save.done)return;busy=true;const n=current();let v=save.visits.at(-1);if(!v||v.node!==save.node){v={id:Date.now(),node:save.node,count:0,choice:null};save.visits.push(v)}if(v.count<n.lines.length)v.count++;else if(n.type==='scene'){save.node=n.next;save.visits.push({id:Date.now(),node:save.node,count:0,choice:null})}if(save.node==='end'){const e=story.nodes.end;const v2=save.visits.at(-1);if(v2.count<e.lines.length)v2.count++;else save.done=true}persist();render();requestAnimationFrame(()=>{$('scroll').scrollTop=$('scroll').scrollHeight});setTimeout(()=>busy=false,220)}function choose(id){if(busy)return;const n=current();const v=save.visits.at(-1);if(n.type!=='choice'||!v||v.node!==save.node||v.choice||v.count!==n.lines.length)return;const o=n.options.find(x=>x[0]===id);if(!o)return;busy=true;v.choice=id;save.node=o[2];save.visits.push({id:Date.now(),node:save.node,count:0,choice:null});persist();render();requestAnimationFrame(()=>{$('scroll').scrollTop=$('scroll').scrollHeight});setTimeout(()=>busy=false,220)}function openReset(){$('dialog').showModal()}$('restart').onclick=openReset;$('restart-top').onclick=openReset;$('cancel').onclick=()=>$('dialog').close();$('confirm').onclick=()=>{save=fresh();persist();render();$('dialog').close();$('scroll').scrollTop=0};$('help').onclick=()=>alert('这是可直接分享的单文件试玩。点击“继续阅读”推进剧情，在选项行作出选择。进度只保存在当前浏览器，不会上传。');$('note-tab').onclick=()=>alert('线索备忘将在正式七宗罪版本中加入。');$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(save,null,2)],{type:'application/json'}));a.download='第七位来电者-试玩进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};load();render();
</script>
